name: Build Android app
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # the Ubuntu runner already has the Android SDK (ANDROID_HOME); Gradle fetches any missing platform itself
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Put the test suite inside the app
        run: |
          mkdir -p android/app/src/main/assets/icons
          cp index.html manifest.webmanifest android/app/src/main/assets/
          cp icons/* android/app/src/main/assets/icons/
      # the face tracker for the app: MediaPipe Tasks (CPU / WebAssembly) and its model, packed inside the APK
      - name: Pack the face tracker
        run: |
          mkdir -p android/app/src/main/assets/mp
          cd /tmp && npm pack @mediapipe/tasks-vision@0.10.14 --silent && tar xzf mediapipe-tasks-vision-0.10.14.tgz && cd -
          cp /tmp/package/vision_bundle.mjs android/app/src/main/assets/mp/vision_bundle.js
          cp -r /tmp/package/wasm android/app/src/main/assets/mp/
          curl -fsSL -o android/app/src/main/assets/mp/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          echo "64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff  android/app/src/main/assets/mp/face_landmarker.task" | sha256sum -c -
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk EyeLab.apk
      - uses: actions/upload-artifact@v4
        with: { name: EyeLab-apk, path: EyeLab.apk }
      - name: Publish as a release (download link on the repo's Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Eye Lab build ${{ github.run_number }}
          files: EyeLab.apk
          make_latest: true
